name: rebuild-all
on:
  schedule:
    - cron: '01 01 21 * *' # min hour day-of-month month day-of-week: 21st of each month 01:01 UTC
  workflow_dispatch:
    inputs:
      workflows:
        description: 'space-separated workflow names to re-run (without .yml)'
        required: true
        default: 'grbts jupyter-hub jupyter-lab rbackup strongswan vlmcsd'
        type: string
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOWS: ${{ inputs.workflows || 'grbts jupyter-hub jupyter-lab rbackup strongswan vlmcsd' }}
    steps:
      ## retag=false: every target workflow must declare a boolean 'retag' input; this forces a rebuild, not a retag
      - run: |
          set -ex
          for wf in $WORKFLOWS; do
            gh workflow run "$wf.yml" --ref "${{ github.ref_name }}" -f retag=false
          done
