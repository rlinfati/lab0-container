name: jupyter-lab-build
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'apps'
        default: 'julia'
        required: true
        type: string
      vers:
        description: 'vers'
        default: '1.12'
        required: true
        type: string
      fecha:
        description: 'fecha'
        default: '9999-99-99'
        required: true
        type: string
  workflow_call:
    inputs:
      apps:
        required: true
        type: string
      vers:
        required: true
        type: string
      fecha:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build:
    continue-on-error: ${{ inputs.apps == 'julia' && inputs.vers == '1.13' }}
    strategy:
      matrix:
        arch:
## https://github.com/JuliaCI/julia-buildkite/blob/main/utilities/build_envs.sh
## CPU_TARGET="generic;cortex-a76,clone_all"
## CPU_TARGET="generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
          - runson: ubuntu-24.04
            tagarch: x86_64
            cpuarch: generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)
          - runson: ubuntu-24.04-arm
            tagarch: aarch64
            cpuarch: generic;cortex-a76,clone_all
    runs-on: ${{ matrix.arch.runson }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          context: ./jupyter-lab
          build-args: |
            JULIA_CPU_TARGET=${{ matrix.arch.cpuarch }}
            TARGET=${{ inputs.apps }}
            JULIA_VERSION=${{ inputs.vers }}
          tags: ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }}-${{ matrix.arch.tagarch }}-${{ inputs.fecha }}
          cache-from: type=gha,scope=jupyter-lab-build-${{ matrix.arch.tagarch }}
          cache-to:   ${{ inputs.apps == 'base' && format('type=gha,scope=jupyter-lab-build-{0}', matrix.arch.tagarch) || '' }}
  manifest:
    continue-on-error: ${{ inputs.apps == 'julia' && inputs.vers == '1.13' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -ex
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }}-x86_64-${{ inputs.fecha }}
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }}-aarch64-${{ inputs.fecha }}
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }}-${{ inputs.fecha }} \
            ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }}-x86_64-${{ inputs.fecha }} \
            ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }}-aarch64-${{ inputs.fecha }}
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }} \
            ghcr.io/${{ github.repository_owner }}/lab0-container:jupyter-lab-${{ inputs.apps }}-${{ inputs.vers }}-${{ inputs.fecha }}
